<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>局タスク管理ボード</title>
<style>
  :root{
    --bg:#f2f4f7;
    --panel:#ffffff;
    --border:#dde1e7;
    --text:#1f2430;
    --muted:#6b7280;
    --accent:#3b5bdb;
    --accent-soft:#e8ecfd;
    --danger:#e03131;
    --danger-soft:#ffe3e3;
    --warn:#f08c00;
    --warn-soft:#fff3bf;
    --ok:#2f9e44;
    --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Hiragino Sans","Yu Gothic",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;}

  /* ---------- ローディング ---------- */
  #loadingScreen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:900;}
  #loadingScreen.hidden{display:none;}
  .loadingBox{background:var(--panel);border-radius:12px;padding:32px 40px;text-align:center;box-shadow:var(--shadow);min-width:240px;}
  .spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #loadingMsg{font-size:13px;color:var(--muted);margin:0 0 12px;}

  /* ---------- ヘッダー ---------- */
  header{
    background:var(--panel);border-bottom:1px solid var(--border);
    padding:8px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    position:sticky;top:0;z-index:50;
  }
  header h1{font-size:15px;margin:0;white-space:nowrap;}
  header .spacer{flex:1;}
  header .userSelect{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);}
  header select, header input[type=text]{padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;}
  .iconBtn{
    padding:7px 12px;border:1px solid var(--border);background:#fff;border-radius:7px;font-size:13px;color:var(--text);
    display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  }
  .iconBtn:hover{background:#f7f8fa;}
  .iconBtn.accentBtn{background:var(--accent);color:#fff;border-color:var(--accent);}
  .iconBtn.accentBtn:hover{filter:brightness(1.05);}

  /* ---------- フェーズバー ---------- */
  #phaseBar{
    background:var(--panel);border-bottom:1px solid var(--border);
    padding:6px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;
  }
  .phaseBarLabel{color:var(--muted);white-space:nowrap;}
  #phaseTabs{display:flex;gap:6px;flex-wrap:wrap;}
  .phaseTab{
    border:1px solid var(--border);background:#fff;border-radius:16px;padding:5px 12px;font-size:12.5px;color:var(--text);
  }
  .phaseTab:hover{background:#f7f8fa;}
  .phaseTab.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .phaseTab.archived{opacity:.6;}
  .archToggle{display:flex;align-items:center;gap:4px;color:var(--muted);white-space:nowrap;}

  /* ---------- アラートバナー ---------- */
  #alertBanner{
    display:none;margin:12px 20px 0;padding:10px 16px;border-radius:8px;font-size:13px;
    background:var(--danger-soft);color:#a61e1e;border:1px solid #ffc9c9;gap:8px;align-items:center;flex-wrap:wrap;
  }
  #alertBanner.show{display:flex;}
  #alertBanner b{font-weight:700;}
  #alertBanner .warnCount{color:#8a5300;}

  /* ---------- ボード ---------- */
  main{padding:16px 0 60px;overflow-x:auto;}
  #board{display:inline-flex;flex-direction:column;padding:0 20px;min-width:max-content;}
  /* 列ヘッダー行 */
  .boardColHeaders{display:flex;gap:10px;margin-bottom:4px;align-items:stretch;}
  .laneHeaderSpacer{width:110px;flex-shrink:0;}
  .colHeaderCell{
    width:230px;flex:0 0 230px;background:#eceef2;border-radius:10px;
    display:flex;align-items:center;gap:6px;padding:8px 10px;
  }
  .colHeaderCell .title{
    font-size:13px;font-weight:700;flex:1;background:transparent;border:none;padding:2px 4px;border-radius:6px;
  }
  .colHeaderCell .title:focus{background:#fff;outline:1px solid var(--border);}
  .colHeaderCell .count{font-size:12px;color:var(--muted);background:#fff;border-radius:10px;padding:1px 8px;}
  .colHeaderCell .delColBtn{background:none;border:none;color:var(--muted);font-size:14px;padding:2px 4px;}
  .colHeaderCell .delColBtn:hover{color:var(--danger);}
  /* スイムレーン行 */
  .swimlaneRow{display:flex;gap:10px;padding:8px 0;border-top:2px solid var(--border);}
  .swimlaneRow:first-of-type{border-top:none;}
  .laneLabel{
    width:110px;flex-shrink:0;background:#eceef2;border-radius:8px;
    display:flex;align-items:center;gap:4px;padding:6px 8px;
  }
  .laneLabel input.laneName{
    flex:1;background:transparent;border:none;font-size:11.5px;font-weight:700;
    padding:2px 4px;border-radius:6px;min-width:0;color:var(--text);
  }
  .laneLabel input.laneName:focus{background:#fff;outline:1px solid var(--border);}
  .laneLabel .delLaneBtn{background:none;border:none;color:var(--muted);font-size:12px;padding:1px 3px;flex-shrink:0;}
  .laneLabel .delLaneBtn:hover{color:var(--danger);}
  /* セル (列×レーン) */
  .cardCell{width:230px;flex:0 0 230px;background:#eceef2;border-radius:8px;display:flex;flex-direction:column;}
  .cardCell.dragover{outline:2px dashed var(--accent);outline-offset:-2px;}
  .cardList{overflow-y:auto;padding:4px 8px 0;display:flex;flex-direction:column;gap:6px;min-height:36px;}
  .addCardBtn{
    margin:4px 8px 8px;background:none;border:1px dashed #c3c9d3;border-radius:8px;padding:5px;
    font-size:12px;color:var(--muted);text-align:center;
  }
  .addCardBtn:hover{background:#fff;border-color:var(--accent);color:var(--accent);}
  /* レーン・列追加 */
  .addLaneBtn{
    border:2px dashed #c3c9d3;border-radius:8px;background:none;color:var(--muted);
    height:28px;width:110px;font-size:11px;margin-top:6px;
  }
  .addLaneBtn:hover{border-color:var(--accent);color:var(--accent);}
  .addColumnBtn{
    flex-shrink:0;border:2px dashed #c3c9d3;border-radius:10px;background:none;color:var(--muted);
    height:36px;font-size:12px;width:160px;align-self:center;
  }
  .addColumnBtn:hover{border-color:var(--accent);color:var(--accent);}

  .card{
    background:#fff;border-radius:7px;padding:7px 9px;box-shadow:var(--shadow);cursor:grab;
    border-left:3px solid #cfd4dc;
  }
  .card:active{cursor:grabbing;}
  .card.dragging{opacity:.4;}
  .card.overdue{border-left-color:var(--danger);}
  .card.soon{border-left-color:var(--warn);}
  .card .cTitle{font-size:12px;font-weight:600;margin-bottom:4px;word-break:break-word;}
  .card .cMeta{display:flex;flex-wrap:wrap;gap:4px;font-size:10px;}
  .card .badge{border-radius:5px;padding:2px 6px;background:#f1f3f5;color:var(--muted);}
  .card .badge.assignee{background:var(--accent-soft);color:var(--accent);}
  .card .badge.due{background:#f1f3f5;color:var(--muted);}
  .card .badge.due.overdue{background:var(--danger-soft);color:var(--danger);}
  .card .badge.due.soon{background:var(--warn-soft);color:#8a5300;}
  .card .badge.phase{background:#f3e8ff;color:#8033c9;}
  .card .cProgress{margin-top:6px;font-size:11px;color:var(--muted);}

  /* ---------- モーダル ---------- */
  .modalOverlay{
    position:fixed;inset:0;background:rgba(20,22,30,.45);display:none;align-items:flex-start;justify-content:center;
    z-index:200;padding:40px 16px;overflow-y:auto;
  }
  .modalOverlay.show{display:flex;}
  .modal{background:#fff;border-radius:12px;width:520px;max-width:100%;box-shadow:var(--shadow);}
  .modal .mHead{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border);}
  .modal .mHead input{flex:1;font-size:16px;font-weight:700;border:none;padding:4px 6px;border-radius:6px;}
  .modal .mHead input:focus{outline:1px solid var(--border);}
  .modal .closeBtn{background:none;border:none;font-size:18px;color:var(--muted);padding:2px 8px;}
  .modal .mBody{padding:16px 18px;display:flex;flex-direction:column;gap:16px;max-height:70vh;overflow-y:auto;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600;}
  .field textarea{width:100%;min-height:64px;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;resize:vertical;}
  .fieldRow{display:flex;gap:12px;}
  .fieldRow .field{flex:1;}
  .field select, .field input[type=date]{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:8px;font-size:13px;}

  .checklist ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;}
  .checklist li{display:flex;align-items:center;gap:8px;font-size:13px;}
  .checklist li span{flex:1;}
  .checklist li.done span{text-decoration:line-through;color:var(--muted);}
  .checklist li button{background:none;border:none;color:var(--muted);font-size:13px;}
  .checklist li button:hover{color:var(--danger);}
  .addRow{display:flex;gap:6px;margin-top:8px;}
  .addRow input{flex:1;border:1px solid var(--border);border-radius:7px;padding:7px 9px;font-size:13px;}
  .addRow button{border:1px solid var(--border);background:#fff;border-radius:7px;padding:0 12px;font-size:13px;}
  .addRow button:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}

  .comments .cItem{background:#f7f8fa;border-radius:8px;padding:8px 10px;font-size:13px;}
  .comments .cItem .cMetaLine{font-size:11px;color:var(--muted);margin-bottom:3px;display:flex;justify-content:space-between;}
  .comments .cItem .cMetaLine button{background:none;border:none;color:var(--muted);font-size:11px;}
  .comments .cItem .cMetaLine button:hover{color:var(--danger);}
  .comments .cList{display:flex;flex-direction:column;gap:8px;max-height:180px;overflow-y:auto;}

  .related ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;}
  .related li{display:flex;align-items:center;gap:8px;font-size:13px;}
  .related .relTitle{flex:1;color:var(--accent);cursor:pointer;}
  .related .relTitle:hover{text-decoration:underline;}
  .related .unlinkBtn{background:none;border:none;color:var(--muted);font-size:13px;}
  .related .unlinkBtn:hover{color:var(--danger);}

  .historyField summary{cursor:pointer;font-size:12px;color:var(--muted);font-weight:600;}
  .historyField ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:160px;overflow-y:auto;}
  .historyField li{font-size:12px;color:var(--muted);}

  .mFoot{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-top:1px solid var(--border);}
  .deleteCardBtn{background:none;border:1px solid var(--danger);color:var(--danger);border-radius:7px;padding:7px 12px;font-size:12px;}
  .deleteCardBtn:hover{background:var(--danger-soft);}

  /* ---------- 設定モーダル ---------- */
  .settingsList{display:flex;flex-direction:column;gap:8px;}
  .memberRow{display:flex;gap:6px;align-items:center;}
  .memberRow input{flex:1;border:1px solid var(--border);border-radius:7px;padding:7px 9px;font-size:13px;}
  .memberRow input[type=color]{flex:0 0 32px;width:32px;height:32px;padding:2px;border-radius:6px;cursor:pointer;}
  .memberRow button{background:none;border:none;color:var(--muted);font-size:14px;}
  .memberRow button:hover{color:var(--danger);}

  /* スプリント設定カード */
  .sprintItem{background:#f7f8fa;border:1px solid var(--border);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;}
  .sprintItemHead{display:flex;gap:6px;align-items:center;}
  .sprintItemHead input[type=text]{flex:1;border:1px solid var(--border);border-radius:7px;padding:5px 8px;font-size:13px;}
  .sprintItemHead .statusBadge{font-size:11px;color:var(--muted);white-space:nowrap;}
  .sprintItemHead button{background:none;border:none;color:var(--muted);font-size:13px;}
  .sprintItemHead button:hover{color:var(--danger);}
  .sprintItemDates{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);}
  .sprintItemDates label{white-space:nowrap;font-size:11px;}
  .sprintItemDates input[type=date]{padding:4px 6px;border:1px solid var(--border);border-radius:6px;font-size:12px;}
  .sprintItemDates .daysLeft{white-space:nowrap;font-size:11px;padding:2px 6px;border-radius:10px;background:#f1f3f5;}
  .sprintItemDates .daysLeft.over{background:var(--danger-soft);color:var(--danger);}
  /* スプリントタブの日付行 */
  .phaseTab{display:inline-flex;flex-direction:column;align-items:center;}
  .phaseTab .tabDates{font-size:10px;opacity:.75;line-height:1.3;white-space:nowrap;}

  footer.hint{padding:0 20px 30px;font-size:11px;color:var(--muted);}
  @media (max-width:600px){
    .modal{width:100%;}
    header h1{font-size:15px;}
  }
</style>
</head>
<body>

<div id="loadingScreen">
  <div class="loadingBox">
    <div class="spinner"></div>
    <p id="loadingMsg">読み込み中...</p>
    <button id="loginRetryBtn" style="display:none;" class="iconBtn accentBtn">再ログイン</button>
  </div>
</div>

<header>
  <h1>📋 局タスク管理ボード</h1>
  <div class="spacer"></div>
  <div class="userSelect">
    <select id="currentUserSelect"></select>
    <button class="iconBtn" id="logoutBtn" style="padding:4px 8px;font-size:12px;">ログアウト</button>
  </div>
  <button class="iconBtn" id="filterClearBtn" style="display:none;">絞り込み解除</button>
  <button class="iconBtn" id="settingsBtn">⚙ 設定</button>
  <button class="iconBtn" id="exportBtn">↓ 書き出し</button>
  <button class="iconBtn" id="importBtn">↑ 読み込み</button>
  <input type="file" id="importFile" accept="application/json" style="display:none;">
  <button class="iconBtn accentBtn" id="notifyBtn">🔔 通知を有効化</button>
</header>

<div id="phaseBar">
  <span class="phaseBarLabel">スプリント:</span>
  <div id="phaseTabs"></div>
  <button class="iconBtn" id="addPhaseBtn">＋ 新しいスプリント</button>
  <button class="iconBtn" id="setCurrentPhaseBtn" style="display:none;">🎯 これを既定のスプリントにする</button>
  <label class="archToggle"><input type="checkbox" id="showArchivedPhasesToggle"> アーカイブ済みも表示</label>
</div>

<div id="alertBanner"></div>

<main>
  <div id="board"></div>
</main>

<footer class="hint">データはこの端末のブラウザ(localStorage)に保存されます。他のメンバーと共有する場合は「書き出し」でJSONを渡し、相手に「読み込み」してもらってください。</footer>

<!-- カード編集モーダル -->
<div class="modalOverlay" id="cardModalOverlay">
  <div class="modal">
    <div class="mHead">
      <input type="text" id="cardTitleInput" placeholder="カードのタイトル">
      <button class="closeBtn" id="cardModalClose">✕</button>
    </div>
    <div class="mBody">
      <div class="field">
        <label>説明</label>
        <textarea id="cardDescInput" placeholder="詳細・メモ"></textarea>
      </div>
      <div class="fieldRow">
        <div class="field">
          <label>担当者</label>
          <select id="cardAssigneeInput"></select>
        </div>
        <div class="field">
          <label>スプリント</label>
          <select id="cardPhaseInput"></select>
        </div>
      </div>
      <div class="field">
        <label>業務種別 (レーン)</label>
        <select id="cardSwimlaneInput"></select>
      </div>
      <div class="fieldRow">
        <div class="field">
          <label>開始日</label>
          <input type="date" id="cardStartInput">
        </div>
        <div class="field">
          <label>期限</label>
          <input type="date" id="cardDueInput">
        </div>
      </div>
      <div class="field checklist">
        <label>チェックリスト</label>
        <ul id="checklistItems"></ul>
        <div class="addRow">
          <input type="text" id="checklistNewInput" placeholder="新しい項目を追加してEnter">
          <button id="checklistAddBtn">追加</button>
        </div>
      </div>
      <div class="field related">
        <label>関連タスク</label>
        <ul id="relatedList"></ul>
        <div class="addRow">
          <select id="relatedAddSelect"><option value="">カードを選択...</option></select>
          <button id="relatedAddBtn">追加</button>
        </div>
      </div>
      <div class="field comments">
        <label>コメント</label>
        <div class="cList" id="commentList"></div>
        <div class="addRow">
          <input type="text" id="commentNewInput" placeholder="コメントを入力してEnter">
          <button id="commentAddBtn">送信</button>
        </div>
      </div>
      <details class="field historyField">
        <summary>変更履歴 (<span id="historyCount">0</span>件)</summary>
        <ul id="historyList"></ul>
      </details>
    </div>
    <div class="mFoot">
      <button class="deleteCardBtn" id="cardDeleteBtn">このカードを削除</button>
      <button class="iconBtn accentBtn" id="cardModalDone">閉じる</button>
    </div>
  </div>
</div>

<!-- 設定モーダル -->
<div class="modalOverlay" id="settingsModalOverlay">
  <div class="modal">
    <div class="mHead">
      <div style="font-size:16px;font-weight:700;">設定</div>
      <button class="closeBtn" id="settingsModalClose">✕</button>
    </div>
    <div class="mBody">
      <div class="field">
        <label>メンバー一覧(担当者の選択肢になります)</label>
        <div class="settingsList" id="memberList"></div>
        <div class="addRow">
          <input type="text" id="memberNewInput" placeholder="メンバー名を追加してEnter">
          <button id="memberAddBtn">追加</button>
        </div>
      </div>
      <div class="field">
        <label>スプリント一覧(既定スプリントは📌で表示・アーカイブすると絞り込みタブから隠れます)</label>
        <div class="settingsList" id="phaseList"></div>
      </div>
      <div class="field">
        <label>期限アラートの基準日数</label>
        <input type="number" id="alertDaysInput" min="0" max="30" style="width:100px;padding:7px 9px;border:1px solid var(--border);border-radius:8px;">
        <span style="font-size:12px;color:var(--muted);"> 日以内を「まもなく期限」として警告表示します</span>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  const BOX_CLIENT_ID    = "wkpnb36allmfibnaxeehnem9aw278tgf";
  const BOX_REDIRECT_URI = "https://cwu.app.box.com/file/2363311804189";
  const INDEX_FILE_ID    = "2363311804189";
  const DATA_FILENAME    = "kanban_data.json";
  const BOX_TOKEN_KEY    = "kanban_box_token";
  const BOX_EXP_KEY      = "kanban_box_exp";
  const BOX_DATA_FID_KEY = "kanban_box_dfid";

  const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36);

  function hexToRgba(hex, alpha){
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  function defaultData(){
    const phase1 = {id: uid(), name: "スプリント1", archived:false, startDate:"", endDate:"", createdAt: Date.now()};
    const lane1 = {id: uid(), name: "全般"};
    return {
      version: 2,
      alertDays: 2,
      members: ["局長","部下A","部下B"],
      memberColors: {},
      currentUser: "局長",
      columns: [
        {id: uid(), name: "未着手"},
        {id: uid(), name: "進行中"},
        {id: uid(), name: "完了"}
      ],
      swimlanes: [lane1],
      phases: [phase1],
      currentPhaseId: phase1.id,
      boardPhaseFilter: phase1.id,
      cards: []
    };
  }

  let data = defaultData();
  let dataFileId = localStorage.getItem(BOX_DATA_FID_KEY) || null;
  let saveTimer = null;
  let boxUserName = "";

  function normalizeData(parsed){
    // 最低限のフィールド補完(旧バージョンのデータ・外部からのインポートにも対応)
    const d = Object.assign(defaultData(), parsed);
    if(!Array.isArray(d.columns) || d.columns.length===0) d.columns = defaultData().columns;
    if(!Array.isArray(d.cards)) d.cards = [];
    if(!Array.isArray(d.members) || d.members.length===0) d.members = defaultData().members;
    if(!Array.isArray(d.phases) || d.phases.length===0){
      const p = {id: uid(), name: "スプリント1", archived:false, createdAt: Date.now()};
      d.phases = [p];
      d.currentPhaseId = p.id;
      d.boardPhaseFilter = p.id;
    }
    if(!d.currentPhaseId || !d.phases.find(p=>p.id===d.currentPhaseId)) d.currentPhaseId = d.phases[0].id;
    d.phases.forEach(p=>{ if(typeof p.startDate!=="string") p.startDate=""; if(typeof p.endDate!=="string") p.endDate=""; });
    if(!d.boardPhaseFilter || (d.boardPhaseFilter!=="all" && !d.phases.find(p=>p.id===d.boardPhaseFilter))) d.boardPhaseFilter = d.currentPhaseId;
    d.cards.forEach(c=>{
      if(typeof c.phaseId !== "string" || (c.phaseId && !d.phases.find(p=>p.id===c.phaseId))) c.phaseId = d.currentPhaseId;
      if(typeof c.startDate !== "string") c.startDate = "";
      if(!Array.isArray(c.history)) c.history = [];
      if(!Array.isArray(c.relatedIds)) c.relatedIds = [];
    });
    if(!Array.isArray(d.swimlanes) || d.swimlanes.length===0) d.swimlanes = [{id: uid(), name: "全般"}];
    d.cards.forEach(c=>{
      if(!c.swimlaneId || !d.swimlanes.find(l=>l.id===c.swimlaneId)) c.swimlaneId = d.swimlanes[0].id;
    });
    return d;
  }

  // ---------------- Box 認証（Implicit フロー） ----------------
  function getAccessToken(){ return localStorage.getItem(BOX_TOKEN_KEY); }
  function isTokenExpired(){ return Date.now() > parseInt(localStorage.getItem(BOX_EXP_KEY)||"0") - 60000; }
  function storeTokens(accessToken, expiresIn){
    localStorage.setItem(BOX_TOKEN_KEY, accessToken);
    localStorage.setItem(BOX_EXP_KEY, String(Date.now() + expiresIn * 1000));
  }
  function clearAuth(){
    [BOX_TOKEN_KEY, BOX_EXP_KEY, BOX_DATA_FID_KEY,
     "kanban_box_refresh","kanban_box_cv"].forEach(k=>localStorage.removeItem(k));
  }
  function redirectToBoxLogin(){
    // Implicit フロー: トークン交換なし、#access_token= でハッシュに返ってくる
    location.href = "https://account.box.com/api/oauth2/authorize?" + new URLSearchParams({
      response_type:"token", client_id:BOX_CLIENT_ID, redirect_uri:BOX_REDIRECT_URI
    });
  }
  async function tryRefreshToken(){
    // Implicit フローにリフレッシュトークンはない → 再ログイン
    clearAuth(); redirectToBoxLogin(); return false;
  }
  async function boxFetch(url, opts={}){
    if(isTokenExpired()){ if(!await tryRefreshToken()){ clearAuth(); redirectToBoxLogin(); return null; } }
    const r = await fetch(url, {...opts, headers:{Authorization:`Bearer ${getAccessToken()}`, ...(opts.headers||{})}});
    if(r.status===401){ clearAuth(); redirectToBoxLogin(); return null; }
    return r;
  }

  // ---------------- Box データ読み書き ----------------
  async function getOrCreateDataFile(){
    if(dataFileId) return;
    const fi = await boxFetch(`https://api.box.com/2.0/files/${INDEX_FILE_ID}?fields=parent`);
    if(!fi) return;
    const {parent} = await fi.json();
    const li = await boxFetch(`https://api.box.com/2.0/folders/${parent.id}/items?fields=id,name&limit=1000`);
    if(!li) return;
    const found = (await li.json()).entries.find(e=>e.name===DATA_FILENAME);
    if(found){
      dataFileId = found.id;
    }else{
      const fd = new FormData();
      fd.append("attributes", JSON.stringify({name:DATA_FILENAME, parent:{id:parent.id}}));
      fd.append("file", new Blob([JSON.stringify(defaultData())],{type:"application/json"}), DATA_FILENAME);
      const cr = await fetch("https://upload.box.com/api/2.0/files/content",
        {method:"POST", headers:{Authorization:`Bearer ${getAccessToken()}`}, body:fd});
      dataFileId = (await cr.json()).entries[0].id;
    }
    localStorage.setItem(BOX_DATA_FID_KEY, dataFileId);
  }

  async function loadFromBox(){
    await getOrCreateDataFile();
    if(!dataFileId) return defaultData();
    const r = await boxFetch(`https://api.box.com/2.0/files/${dataFileId}/content`);
    if(!r) return defaultData();
    try{ return normalizeData(await r.json()); }catch(e){ return defaultData(); }
  }

  function save(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async()=>{
      if(!dataFileId) return;
      const fd = new FormData();
      fd.append("attributes", JSON.stringify({name:DATA_FILENAME}));
      fd.append("file", new Blob([JSON.stringify(data)],{type:"application/json"}), DATA_FILENAME);
      await fetch(`https://upload.box.com/api/2.0/files/${dataFileId}/content`,
        {method:"POST", headers:{Authorization:`Bearer ${getAccessToken()}`}, body:fd});
    }, 800);
  }

  function todayStr(){
    const d = new Date();
    return d.toISOString().slice(0,10);
  }

  function dueStatus(dueDate){
    if(!dueDate) return null;
    const diffDays = Math.floor((new Date(dueDate) - new Date(todayStr())) / 86400000);
    if(diffDays < 0) return "overdue";
    if(diffDays <= data.alertDays) return "soon";
    return null;
  }

  function phaseName(phaseId){
    const p = data.phases.find(p=>p.id===phaseId);
    return p ? p.name : "";

  function logHistory(card, message){

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  function sprintDateLabel(p){
    if(!p.startDate && !p.endDate) return "";
    const fmt = d => d.slice(5).replace("-","/");
    let label = [p.startDate?fmt(p.startDate):"", p.endDate?fmt(p.endDate):""].filter(Boolean).join(" 〜 ");
    if(p.endDate && !p.archived){
      const diff = Math.ceil((new Date(p.endDate) - new Date(todayStr())) / 86400000);
      label += diff >= 0 ? ` (残${diff}日)` : ` (${-diff}日超過)`;
    }
    return label;
  }

  function renderAlertBanner(){
    const banner = document.getElementById("alertBanner");
    const overdue = data.cards.filter(c=>dueStatus(c.dueDate)==="overdue");
    const soon = data.cards.filter(c=>dueStatus(c.dueDate)==="soon");
    if(overdue.length===0 && soon.length===0){
      banner.classList.remove("show");
      banner.innerHTML = "";
      return;
    }
    let html = "";
    if(overdue.length>0) html += `<span>⚠ <b>期限超過</b>: ${overdue.length}件 (${overdue.slice(0,3).map(c=>escapeHtml(c.title)).join("、")}${overdue.length>3?" ほか":""})</span>`;
    if(soon.length>0) html += `<span class="warnCount">⏰ まもなく期限: ${soon.length}件 (${soon.slice(0,3).map(c=>escapeHtml(c.title)).join("、")}${soon.length>3?" ほか":""})</span>`;
    banner.innerHTML = html;
    banner.classList.add("show");
  }

  function maybeNotify(){
    if(Notification.permission !== "granted") return;
    const overdue = data.cards.filter(c=>dueStatus(c.dueDate)==="overdue");
    const soon = data.cards.filter(c=>dueStatus(c.dueDate)==="soon");
    if(overdue.length===0 && soon.length===0) return;
    const key = "kanban_last_notify_" + todayStr();
    if(sessionStorage.getItem(key)) return;
    sessionStorage.setItem(key, "1");
    const parts = [];
    if(overdue.length) parts.push(`期限超過 ${overdue.length}件`);
    if(soon.length) parts.push(`期限間近 ${soon.length}件`);
    new Notification("局タスク管理ボード", { body: parts.join(" / ") });
  }

  function renderCard(card){
    const el = document.createElement("div");
    el.className = "card";
    el.draggable = true;
    el.dataset.cardId = card.id;
    const status = dueStatus(card.dueDate);
    if(status) el.classList.add(status);
    if(card.assignee && data.memberColors && data.memberColors[card.assignee]){
      const color = data.memberColors[card.assignee];
      el.style.backgroundColor = hexToRgba(color, 0.15);
      if(!status) el.style.borderLeftColor = color;
    }

    const doneCount = card.checklist.filter(i=>i.done).length;
    const progressHtml = card.checklist.length>0
      ? `<div class="cProgress">☑ ${doneCount}/${card.checklist.length}</div>` : "";
    const phase = data.phases.find(p=>p.id===card.phaseId);

    el.innerHTML = `
      <div class="cTitle">${escapeHtml(card.title)}</div>
      <div class="cMeta">
        ${phase ? `<span class="badge phase">${escapeHtml(phase.name)}</span>` : ""}
        ${card.assignee ? `<span class="badge assignee" data-assignee="${escapeHtml(card.assignee)}">${escapeHtml(card.assignee)}</span>` : ""}
        ${card.dueDate ? `<span class="badge due ${status||""}">${escapeHtml(card.dueDate)}</span>` : ""}
        ${card.comments.length>0 ? `<span class="badge">💬 ${card.comments.length}</span>` : ""}
        ${(card.relatedIds||[]).length>0 ? `<span class="badge">🔗 ${card.relatedIds.length}</span>` : ""}
      </div>
      ${progressHtml}
    `;

    el.querySelector(".badge.assignee")?.addEventListener("click", e=>{
      e.stopPropagation();
      assigneeFilter = card.assignee;
      document.getElementById("filterClearBtn").style.display = "inline-flex";
      renderBoard();
    });

    el.addEventListener("click", ()=> openCardModal(card.id));

    el.addEventListener("dragstart", e=>{
      el.classList.add("dragging");
      e.dataTransfer.setData("text/plain", card.id);
    });
    el.addEventListener("dragend", ()=> el.classList.remove("dragging"));

    return el;
  }

  function setupCellDnD(listEl, colId, laneId, cellEl){
    listEl.addEventListener("dragover", e=>{
      e.preventDefault();
      cellEl.classList.add("dragover");
      const dragging = boardEl.querySelector(".card.dragging");
      if(!dragging) return;
      const after = getDragAfterElement(listEl, e.clientY);
      if(after == null) listEl.appendChild(dragging);
      else listEl.insertBefore(dragging, after);
    });
    listEl.addEventListener("dragleave", e=>{
      if(!cellEl.contains(e.relatedTarget)) cellEl.classList.remove("dragover");
    });
    listEl.addEventListener("drop", e=>{
      e.preventDefault();
      cellEl.classList.remove("dragover");
      const cardId = e.dataTransfer.getData("text/plain");
      const card = data.cards.find(c=>c.id===cardId);
      if(card){
        if(card.columnId !== colId){
          const oldName = (data.columns.find(c=>c.id===card.columnId)||{}).name || "?";
          const newName = (data.columns.find(c=>c.id===colId)||{}).name || "?";
          logHistory(card, `ステータスを「${oldName}」→「${newName}」に変更`);
        }
        if(card.swimlaneId !== laneId){
          const oldLane = (data.swimlanes.find(l=>l.id===card.swimlaneId)||{}).name || "?";
          const newLane = (data.swimlanes.find(l=>l.id===laneId)||{}).name || "?";
          logHistory(card, `レーンを「${oldLane}」→「${newLane}」に変更`);
        }
        card.columnId = colId;
        card.swimlaneId = laneId;
        const order = Array.from(listEl.querySelectorAll(".card")).map(el=>el.dataset.cardId);
        const inOrder = new Set(order);
        const reordered = order.map(id=>data.cards.find(c=>c.id===id)).filter(Boolean);
        data.cards = [...data.cards.filter(c=>!inOrder.has(c.id)), ...reordered];
        save();
      }
      renderBoard();
    });
  }

  function getDragAfterElement(container, y){
    const els = [...container.querySelectorAll(".card:not(.dragging)")];
    return els.reduce((closest, child)=>{
      const box = child.getBoundingClientRect();
      const offset = y - box.top - box.height/2;
      if(offset < 0 && offset > closest.offset){
        return {offset, element: child};
      }else{
        return closest;
      }
    }, {offset: -Infinity}).element;
  }

  function renderChecklist(card){

  function renderComments(card){
    commentListEl.innerHTML = "";
    card.comments.slice().reverse().forEach(cm=>{
      const div = document.createElement("div");
      div.className = "cItem";
      const dt = new Date(cm.ts);
      div.innerHTML = `
        <div class="cMetaLine">
          <span>${escapeHtml(cm.author)} ・ ${dt.toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}</span>
          <button title="削除">✕</button>
        </div>
        <div>${escapeHtml(cm.text)}</div>
      `;
      div.querySelector("button").addEventListener("click", ()=>{
        card.comments = card.comments.filter(c=>c.id!==cm.id);
        save();
        renderComments(card);
      });
      commentListEl.appendChild(div);
    });
  }

  function renderRelated(card){
    relatedListEl.innerHTML = "";
    (card.relatedIds||[]).forEach(rid=>{
      const rc = data.cards.find(c=>c.id===rid);
      const li = document.createElement("li");
      const label = rc ? escapeHtml(rc.title) : "(削除済みのカード)";
      li.innerHTML = `<span class="relTitle">${label}</span><button class="unlinkBtn" title="解除">✕</button>`;
      if(rc){
        li.querySelector(".relTitle").addEventListener("click", ()=> openCardModal(rc.id));
      }
      li.querySelector(".unlinkBtn").addEventListener("click", ()=> unlinkRelated(card, rid));
      relatedListEl.appendChild(li);
    });

    relatedAddSelect.innerHTML = `<option value="">カードを選択...</option>` + data.cards
      .filter(c=>c.id!==card.id && !(card.relatedIds||[]).includes(c.id))
      .map(c=>`<option value="${c.id}">${escapeHtml(c.title)}</option>`).join("");
  }

  function linkRelated(card, otherId){
    const other = data.cards.find(c=>c.id===otherId);
    if(!other) return;
    card.relatedIds = card.relatedIds || [];
    other.relatedIds = other.relatedIds || [];
    if(!card.relatedIds.includes(otherId)) card.relatedIds.push(otherId);
    if(!other.relatedIds.includes(card.id)) other.relatedIds.push(card.id);
    logHistory(card, `関連タスクを追加: 「${other.title}」`);
    logHistory(other, `関連タスクを追加: 「${card.title}」`);
    save();
    renderRelated(card);
    renderHistory(card);
  }

  function unlinkRelated(card, otherId){
    const other = data.cards.find(c=>c.id===otherId);
    card.relatedIds = (card.relatedIds||[]).filter(id=>id!==otherId);
    logHistory(card, `関連タスクを解除: 「${other ? other.title : "(削除済みのカード)"}」`);
    if(other){
      other.relatedIds = (other.relatedIds||[]).filter(id=>id!==card.id);
      logHistory(other, `関連タスクを解除: 「${card.title}」`);
    }
    save();
    renderRelated(card);
    renderHistory(card);
  }

  document.getElementById("relatedAddBtn").addEventListener("click", ()=>{
    const otherId = relatedAddSelect.value;
    if(!otherId) return;
    const card = currentCard(); if(!card) return;
    linkRelated(card, otherId);
  });

  function renderHistory(card){
    const hist = card.history || [];
    historyCountEl.textContent = hist.length;
    historyListEl.innerHTML = "";
    hist.slice().reverse().forEach(h=>{
      const li = document.createElement("li");
      const dt = new Date(h.ts);
      li.textContent = `${dt.toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})} ${h.user}: ${h.message}`;
      historyListEl.appendChild(li);
    });
  }

  cardTitleInput.addEventListener("change", ()=>{
    const card = currentCard(); if(!card) return;
    const newVal = cardTitleInput.value || "無題のカード";
    if(newVal !== card.title){
      logHistory(card, `タイトルを変更: 「${card.title}」→「${newVal}」`);
      card.title = newVal;
      save();
      renderHistory(card);
    }
  });
  cardDescInput.addEventListener("change", ()=>{
    const card = currentCard(); if(!card) return;
    if(cardDescInput.value !== card.desc){
      card.desc = cardDescInput.value;
      logHistory(card, "説明を更新");
      save();
      renderHistory(card);
    }
  });
  cardAssigneeInput.addEventListener("change", ()=>{
    const card = currentCard(); if(!card) return;
    const newVal = cardAssigneeInput.value;
    if(newVal !== card.assignee){
      logHistory(card, `担当者を変更: 「${card.assignee||"未設定"}」→「${newVal||"未設定"}」`);
      card.assignee = newVal;
      save();
      renderHistory(card);
    }
  });
  cardPhaseInput.addEventListener("change", ()=>{
    const card = currentCard(); if(!card) return;
    const newVal = cardPhaseInput.value;
    if(newVal !== card.phaseId){
      logHistory(card, `スプリントを変更: 「${phaseName(card.phaseId)||"未設定"}」→「${phaseName(newVal)||"未設定"}」`);
      card.phaseId = newVal;
      save();
      renderHistory(card);
    }
  });
  cardStartInput.addEventListener("change", ()=>{
    const card = currentCard(); if(!card) return;
    if(cardStartInput.value !== card.startDate){
      logHistory(card, `開始日を変更: 「${card.startDate||"未設定"}」→「${cardStartInput.value||"未設定"}」`);
      card.startDate = cardStartInput.value;
      save();
      renderHistory(card);
    }
  });
  cardDueInput.addEventListener("change", ()=>{
    const card = currentCard(); if(!card) return;
    if(cardDueInput.value !== card.dueDate){
      logHistory(card, `期限を変更: 「${card.dueDate||"未設定"}」→「${cardDueInput.value||"未設定"}」`);
      card.dueDate = cardDueInput.value;
      save();
      renderHistory(card);
    }
  });
  cardSwimlaneInput.addEventListener("change", ()=>{
    const card = currentCard(); if(!card) return;
    const newVal = cardSwimlaneInput.value;
    if(newVal !== card.swimlaneId){
      const oldLane = (data.swimlanes.find(l=>l.id===card.swimlaneId)||{}).name || "未設定";
      const newLane = (data.swimlanes.find(l=>l.id===newVal)||{}).name || "未設定";
      logHistory(card, `レーンを変更: 「${oldLane}」→「${newLane}」`);
      card.swimlaneId = newVal;
      save();
      renderHistory(card);
    }
  });

  function addChecklistItem(){
    const text = checklistNewInput.value.trim();
    if(!text) return;
    const card = currentCard(); if(!card) return;
    card.checklist.push({id: uid(), text, done:false});
    checklistNewInput.value = "";
    save();
    renderChecklist(card);
  }
  document.getElementById("checklistAddBtn").addEventListener("click", addChecklistItem);
  checklistNewInput.addEventListener("keydown", e=>{ if(e.key==="Enter") addChecklistItem(); });

  function addComment(){
    const text = commentNewInput.value.trim();
    if(!text) return;
    const card = currentCard(); if(!card) return;
    card.comments.push({id: uid(), author: data.currentUser, text, ts: Date.now()});
    commentNewInput.value = "";
    save();
    renderComments(card);
  }
  document.getElementById("commentAddBtn").addEventListener("click", addComment);
  commentNewInput.addEventListener("keydown", e=>{ if(e.key==="Enter") addComment(); });

  document.getElementById("cardDeleteBtn").addEventListener("click", ()=>{
    const card = currentCard(); if(!card) return;
    if(!confirm(`「${card.title}」を削除しますか？`)) return;
    data.cards.forEach(c=>{ c.relatedIds = (c.relatedIds||[]).filter(id=>id!==card.id); });
    data.cards = data.cards.filter(c=>c.id!==card.id);
    save();
    closeCardModal();
  });
  document.getElementById("cardModalClose").addEventListener("click", closeCardModal);
  document.getElementById("cardModalDone").addEventListener("click", closeCardModal);
  cardModalOverlay.addEventListener("click", e=>{ if(e.target===cardModalOverlay) closeCardModal(); });

  // ---------------- 設定モーダル ----------------
  const settingsModalOverlay = document.getElementById("settingsModalOverlay");
  const memberListEl = document.getElementById("memberList");
  const memberNewInput = document.getElementById("memberNewInput");
  const alertDaysInput = document.getElementById("alertDaysInput");

  function renderMemberList(){
    memberListEl.innerHTML = "";
    data.members.forEach((m, idx)=>{
      const row = document.createElement("div");
      row.className = "memberRow";
      const currentColor = (data.memberColors && data.memberColors[m]) || "#cfd4dc";
      row.innerHTML = `<input type="color" value="${currentColor}" title="カードの色"><input type="text" value="${escapeHtml(m)}"><button title="削除">✕</button>`;
      row.querySelector("input[type=color]").addEventListener("input", e=>{
        if(!data.memberColors) data.memberColors = {};
        data.memberColors[m] = e.target.value;
        save();
        renderBoard();
      });
      row.querySelector("input[type=text]").addEventListener("change", e=>{
        const oldName = data.members[idx];
        const newName = e.target.value.trim() || oldName;
        data.members[idx] = newName;
        data.cards.forEach(c=>{ if(c.assignee===oldName) c.assignee = newName; });
        if(data.currentUser===oldName) data.currentUser = newName;
        if(data.memberColors && data.memberColors[oldName] !== undefined){
          data.memberColors[newName] = data.memberColors[oldName];
          delete data.memberColors[oldName];
        }
        save();
        renderUserSelect();
      });
      row.querySelector("button").addEventListener("click", ()=>{
        if(!confirm(`「${m}」をメンバー一覧から削除しますか？`)) return;
        data.members.splice(idx,1);
        if(data.memberColors) delete data.memberColors[m];
        save();
        renderMemberList();
        renderUserSelect();
      });
      memberListEl.appendChild(row);
    });
  }

  function addMember(){
    const name = memberNewInput.value.trim();
    if(!name) return;
    data.members.push(name);
    memberNewInput.value = "";
    save();
    renderMemberList();
    renderUserSelect();
  }
  document.getElementById("memberAddBtn").addEventListener("click", addMember);
  memberNewInput.addEventListener("keydown", e=>{ if(e.key==="Enter") addMember(); });

  const phaseListEl = document.getElementById("phaseList");

  function renderPhaseSettingsList(){
    phaseListEl.innerHTML = "";
    data.phases.forEach(p=>{
      const item = document.createElement("div");
      item.className = "sprintItem";

      const diff = p.endDate ? Math.ceil((new Date(p.endDate) - new Date(todayStr())) / 86400000) : null;
      const daysHtml = (diff !== null && !p.archived)
        ? `<span class="daysLeft${diff<0?" over":""}">${diff>=0?`残${diff}日`:`${-diff}日超過`}</span>` : "";

      item.innerHTML = `
        <div class="sprintItemHead">
          <input type="text" value="${escapeHtml(p.name)}">
          <span class="statusBadge">${p.id===data.currentPhaseId?"📌 ":""}${p.archived?"アーカイブ済み":"進行中"}</span>
          <button class="archiveBtn" title="${p.archived?"再開する":"アーカイブする"}">${p.archived?"⤴":"🗄"}</button>
          <button class="delBtn" title="削除">✕</button>
        </div>
        <div class="sprintItemDates">
          <label>開始</label>
          <input type="date" class="sprintStart" value="${p.startDate||""}">
          <span>〜</span>
          <label>終了</label>
          <input type="date" class="sprintEnd" value="${p.endDate||""}">
          ${daysHtml}
        </div>
      `;
      item.querySelector("input[type=text]").addEventListener("change", e=>{
        p.name = e.target.value.trim() || p.name; save(); renderBoard();
      });
      item.querySelector(".sprintStart").addEventListener("change", e=>{
        p.startDate = e.target.value; save(); renderPhaseTabs();
      });
      item.querySelector(".sprintEnd").addEventListener("change", e=>{
        p.endDate = e.target.value; save(); renderPhaseSettingsList(); renderPhaseTabs();
      });
      item.querySelector(".archiveBtn").addEventListener("click", ()=>{
        p.archived = !p.archived;
        if(p.archived && data.boardPhaseFilter===p.id) data.boardPhaseFilter = "all";
        save(); renderPhaseSettingsList(); renderBoard();
      });
      item.querySelector(".delBtn").addEventListener("click", ()=>{
        const count = data.cards.filter(c=>c.phaseId===p.id).length;
        if(!confirm(`「${p.name}」を削除しますか？${count>0?`(${count}件のカードは未設定になります)`:""}`)) return;
        data.cards.forEach(c=>{ if(c.phaseId===p.id) c.phaseId=""; });
        data.phases = data.phases.filter(x=>x.id!==p.id);
        if(data.phases.length===0){
          const np = {id: uid(), name: "スプリント1", archived:false, startDate:"", endDate:"", createdAt: Date.now()};
          data.phases = [np];
        }
        if(!data.phases.find(x=>x.id===data.currentPhaseId)) data.currentPhaseId = data.phases[0].id;
        if(data.boardPhaseFilter!=="all" && !data.phases.find(x=>x.id===data.boardPhaseFilter)) data.boardPhaseFilter = "all";
        save(); renderPhaseSettingsList(); renderBoard();
      });
      phaseListEl.appendChild(item);
    });
  }

  alertDaysInput.addEventListener("change", ()=>{
    const v = parseInt(alertDaysInput.value, 10);
    data.alertDays = isNaN(v) ? 2 : Math.max(0, v);
    save();
    renderBoard();
  });

  document.getElementById("settingsBtn").addEventListener("click", ()=>{
    renderMemberList();
    renderPhaseSettingsList();
    alertDaysInput.value = data.alertDays;
    settingsModalOverlay.classList.add("show");
  });
  document.getElementById("settingsModalClose").addEventListener("click", ()=>{
    settingsModalOverlay.classList.remove("show");
  });
  settingsModalOverlay.addEventListener("click", e=>{
    if(e.target===settingsModalOverlay) settingsModalOverlay.classList.remove("show");
  });

  // ---------------- 書き出し / 読み込み ----------------
  document.getElementById("exportBtn").addEventListener("click", ()=>{
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `kanban_${todayStr()}.json`;
    a.click();
    URL.revokeObjectURL(url);
  });

  const importFile = document.getElementById("importFile");
  document.getElementById("importBtn").addEventListener("click", ()=> importFile.click());
  importFile.addEventListener("change", ()=>{
    const file = importFile.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const imported = JSON.parse(reader.result);
        if(!Array.isArray(imported.cards) || !Array.isArray(imported.columns)){
          alert("読み込めない形式のファイルです");
          return;
        }
        if(!confirm("現在のボードのカード・列・メンバーを、読み込んだ内容で置き換えます。よろしいですか？")) return;
        data = normalizeData(imported);
        if(boxUserName && !data.members.includes(boxUserName)) data.members.push(boxUserName);
        if(boxUserName) data.currentUser = boxUserName;
        save();
        renderUserSelect();
        renderBoard();
        alert("読み込みが完了しました");
      }catch(e){
        alert("ファイルの読み込みに失敗しました: " + e.message);
      }
    };
    reader.readAsText(file);
    importFile.value = "";
  });

  // ログアウト
  document.getElementById("logoutBtn").addEventListener("click", ()=>{
    if(confirm("ログアウトしますか？")) { clearAuth(); location.reload(); }
  });

  // ---------------- 初期化 ----------------
  async function init(){
    showLoading("Box にログイン中...");

    // OAuthコールバック処理（Implicit フロー: #access_token= をハッシュから取得）
    const hash = new URLSearchParams(location.hash.slice(1));
    const accessToken = hash.get("access_token");
    if(accessToken){
      storeTokens(accessToken, parseInt(hash.get("expires_in")||"3600"));
      history.replaceState({}, "", location.pathname);
    }

    // トークン確認
    if(!getAccessToken()){
      redirectToBoxLogin(); return;
    }
    if(isTokenExpired()){
      clearAuth(); redirectToBoxLogin(); return;
    }

    // ユーザー情報取得
    showLoading("ユーザー情報を取得中...");
    const ur = await boxFetch("https://api.box.com/2.0/users/me");
    if(!ur) return;
    const userInfo = await ur.json();
    boxUserName = userInfo.name;

    // データ読み込み
    showLoading("データを読み込み中...");
    data = await loadFromBox();

    // Box ユーザーをメンバーに追加し currentUser に固定
    if(!data.members.includes(boxUserName)) data.members.push(boxUserName);
    data.currentUser = boxUserName;

    hideLoading();
    renderUserSelect();
    renderBoard();
  }

  init();
})();
</script>
</body>
</html>
